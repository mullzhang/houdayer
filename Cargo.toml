[package]
name = "houdayer"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Rust core for bounded Houdayer cluster recombination"
repository = "https://github.com/mullzhang/houdayer"
publish = false
include = [
    "/rust/**/*.rs",
    "/python/**/*.py",
    "/python/**/*.pyi",
    "/python/**/py.typed",
    "/tests/**/*.py",
    "/scripts/**/*.py",
    "/examples/**/*.py",
    "/benchmarks/*.py",
    "/docs/*.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/pyproject.toml",
    "/uv.lock",
    "/mise.toml",
    "/LICENSE",
    "/README.md",
    "/CHANGELOG.md",
]

[lib]
name = "_native"
path = "rust/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
rand = "0.9.2"
rand_chacha = "0.9.0"
pyo3 = { version = "0.27.2", features = ["abi3-py310"], optional = true }
numpy = { version = "0.27.1", optional = true }

[profile.release]
lto = "thin"
codegen-units = 1
# Preserve the native linker's symbol layout on macOS.
strip = "none"
