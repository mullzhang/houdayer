name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.13'
          - os: ubuntu-24.04
            python: '3.14'
          - os: macos-14
            python: '3.13'
          - os: windows-2022
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: cargo test --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --features python -- -D warnings
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
      - run: uv run --locked python examples/expand_samples.py
      - run: uv run --locked python examples/composite.py
      - run: uv build --no-sources
      - run: uv run --locked python scripts/verify_distribution.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}-${{ matrix.python }}
          path: dist/verification.json
  minimum-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.16'
      - run: uv sync --locked --python 3.10
      - run: uv pip install --python .venv/bin/python 'dimod==0.12.21' 'numpy==1.24.0'
      - run: .venv/bin/python -m pytest
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: cargo test --locked
      - run: cargo check --locked --features python
