[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "houdayer"
version = "0.1.0"
description = "Bounded Houdayer cluster recombination for dimod sample sets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "mullzhang" }]
keywords = ["houdayer", "ising", "qubo", "dimod", "postprocessing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["dimod>=0.12.21,<0.13", "numpy>=1.24"]

[project.urls]
Repository = "https://github.com/mullzhang/houdayer"
Issues = "https://github.com/mullzhang/houdayer/issues"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12", "maturin>=1.9,<2", "twine>=6,<7", "pyyaml>=6"]

[tool.maturin]
python-source = "python"
module-name = "houdayer._native"
features = ["python", "pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust/**/*.rs" },
    { file = "python/**/*.py" },
    { file = "python/**/*.pyi" },
]
